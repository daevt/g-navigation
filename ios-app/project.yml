name: GNavigation
options:
  bundleIdPrefix: com.gnavigation
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1" # iPhone

targets:
  GNavigation:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: GNavigation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gnavigation.ios
        INFOPLIST_FILE: GNavigation/Info.plist
        PRODUCT_NAME: GNavigation
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_BITCODE: "NO"
    dependencies: []
